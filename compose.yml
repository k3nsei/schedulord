services:
  schedulord:
    build:
      context: .
      dockerfile: Containerfile
    image: ghcr.io/k3nsei/schedulord:latest
    restart: unless-stopped
    init: true
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./config.yml:/app/config.yml:ro
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev,noexec
